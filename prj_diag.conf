# DIAGNOSTIC build (temporary, OTA reverse-path investigation):
# release prj.conf plus logging over the dongle's USB CDC console.
CONFIG_LOG=y
CONFIG_CONSOLE=y
CONFIG_BOOT_BANNER=y
CONFIG_PRINTK=y
CONFIG_LOG_BACKEND_UART=y
CONFIG_UART_CONSOLE=y
CONFIG_SERIAL=y
CONFIG_LOG_BACKEND_RTT=n
CONFIG_LOG_MODE_DEFERRED=y

# ESB radio link
CONFIG_ESB=y
CONFIG_CLOCK_CONTROL=y
CONFIG_ESB_CLOCK_INIT=y
CONFIG_ESB_RADIO_IRQ_PRIORITY=0
CONFIG_ESB_PIPE_COUNT=8

# Platform
CONFIG_GPIO=y
CONFIG_PINCTRL=y
CONFIG_FLASH=y
CONFIG_SYSTEM_CLOCK_WAIT_FOR_STABILITY=y
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_BUILD_OUTPUT_UF2=n

# Initialize the HID device from main after registering its report descriptor.
CONFIG_BOARD_SERIAL_BACKEND_CDC_ACM=n
CONFIG_USB_CDC_ACM=y

# Legacy USB HID device stack; CDC ACM console alongside HID.
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_DEVICE_INITIALIZE_AT_BOOT=n
CONFIG_USB_COMPOSITE_DEVICE=y
CONFIG_USB_DEVICE_HID=y
CONFIG_ENABLE_HID_INT_OUT_EP=y
CONFIG_USB_DEVICE_VID=0x1B4F
CONFIG_USB_DEVICE_PID=0x0001
CONFIG_USB_DEVICE_PRODUCT="A4TECH Receiver"
CONFIG_USB_DEVICE_MANUFACTURER="Monard"

# Diag: the receiver main loop never blocks, so it would starve the log
# and status threads at default priorities. Keep logging runnable.
CONFIG_MAIN_THREAD_PRIORITY=10
CONFIG_LOG_PROCESS_THREAD_PRIORITY=9
