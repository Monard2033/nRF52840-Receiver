# Release build: USB HID only, no UART or CDC debug logging.
CONFIG_LOG=n
CONFIG_CONSOLE=n
CONFIG_BOOT_BANNER=n
CONFIG_NCS_BOOT_BANNER=n
CONFIG_PRINTK=n
CONFIG_LOG_BACKEND_UART=n
CONFIG_LOG_BACKEND_RTT=n
CONFIG_UART_CONSOLE=n
CONFIG_SERIAL=n

# ESB radio link
CONFIG_ESB=y
CONFIG_CLOCK_CONTROL=y
CONFIG_ESB_CLOCK_INIT=y
CONFIG_ESB_RADIO_IRQ_PRIORITY=0
CONFIG_ESB_PIPE_COUNT=8

# Platform
CONFIG_GPIO=y
CONFIG_PINCTRL=y
CONFIG_FLASH=y
CONFIG_SYSTEM_CLOCK_WAIT_FOR_STABILITY=y
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_BUILD_OUTPUT_UF2=n

# Initialize the HID device from main after registering its report descriptor.
CONFIG_BOARD_SERIAL_BACKEND_CDC_ACM=n
CONFIG_USB_CDC_ACM=n

# Legacy USB HID device stack without a debug serial interface.
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_DEVICE_INITIALIZE_AT_BOOT=n
CONFIG_USB_COMPOSITE_DEVICE=n
CONFIG_USB_DEVICE_HID=y
CONFIG_USB_DEVICE_VID=0x1B4F
CONFIG_USB_DEVICE_PID=0x0001
CONFIG_USB_DEVICE_PRODUCT="A4TECH Receiver"
CONFIG_USB_DEVICE_MANUFACTURER="Monard"
CONFIG_USB_HID_POLL_INTERVAL_MS=1
CONFIG_USB_HID_BOOT_PROTOCOL=y
CONFIG_USB_DEVICE_OS_DESC=y
